name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - 'repo.json'
      - 'DomainCheck.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
          persist-credentials: false
        continue-on-error: true

      - name: Create builds branch if not exists
        run: |
          cd $GITHUB_WORKSPACE/builds
          if [ ! -d ".git" ]; then
            git init
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git commit --allow-empty -m "Initial commit"
            git branch -M builds
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git push -u origin builds || true
          else
            # Ensure we're on the builds branch even if .git exists from previous run
            git branch -M builds
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 21 (Gradle daemon / AGP)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 17 (library toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Guard against stale daemon JVM pin
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          PROP="$GITHUB_WORKSPACE/src/Cs-Karma/gradle.properties"
          rm -f $GITHUB_WORKSPACE/src/Cs-Karma/gradle/gradle-daemon-jvm.properties
          # dosya newline ile bitmiyorsa once newline ekle (yoksa satirlar yapisir: 'noneorg.gradle...')
          if [ -n "$(tail -c 1 "$PROP")" ]; then
            echo "" >> "$PROP"
          fi
          if grep -q "^org.gradle.java.home=" "$PROP"; then
            sed -i "s|^org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME_21_X64|" "$PROP"
          else
            echo "org.gradle.java.home=$JAVA_HOME_21_X64" >> "$PROP"
          fi
          echo "Daemon JDK: $JAVA_HOME_21_X64"
          "$JAVA_HOME_21_X64/bin/java" -version
          echo "Toolchain JDK 17: $JAVA_HOME_17_X64"
          "$JAVA_HOME_17_X64/bin/java" -version

      - name: Force fresh Gradle Plugin
        run: rm -rf ~/.gradle/caches/modules-2/files-2.1/com.github.recloudstream

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Cs-Karma Plugins
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          cd $GITHUB_WORKSPACE/src/Cs-Karma
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds/plugins-cskarma.json || true

      - name: Build storm-ext Plugins
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          cd $GITHUB_WORKSPACE/src/storm-ext
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds/plugins-stormext.json || true

      - name: Merge plugins.json
        run: |
          python3 - << 'PYEOF'
          import json, os
          builds = "/github/workspace/builds" if os.path.exists("/github/workspace/builds") else os.environ.get("GITHUB_WORKSPACE","") + "/builds"
          out = []
          for f in ["plugins-cskarma.json","plugins-stormext.json"]:
              p = os.path.join(builds, f)
              if os.path.exists(p):
                  with open(p) as fh:
                      data = json.load(fh)
                  for entry in data:
                      # Rewrite URL to point to this repo's builds branch
                      name = entry.get("name","")
                      entry["url"] = f"https://raw.githubusercontent.com/Nahiro18/extensionahi/builds/{name}.cs3"
                      entry["repositoryUrl"] = "https://github.com/Nahiro18/extensionahi"
                      out.append(entry)
                  os.remove(p)
          with open(os.path.join(builds,"plugins.json"),"w") as fh:
              json.dump(out, fh, indent=2, ensure_ascii=False)
          print(f"Merged {len(out)} plugins")
          PYEOF

      - name: Push builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          # Ensure we're on the builds branch
          git branch -M builds
          git add .
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git commit --amend -m "Build $GITHUB_SHA" || git commit -m "Build $GITHUB_SHA" || exit 0
          git push origin builds --force
